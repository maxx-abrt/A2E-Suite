name: CD Docker image

# Builds the production image (backend + frontend, Dockerfile target `twenty`)
# and pushes it to GHCR so Coolify / Portainer / any Docker host can pull it
# instead of building on a small VPS (the frontend build needs ~8 GB of heap).

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Package name is fixed so a repo rename does not break pinned image refs in
  # docker-compose.coolify.yml; the owner part stays derived from the repo.
  IMAGE: ghcr.io/${{ github.repository_owner }}/a2e-suite

jobs:
  build-and-push:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      HAS_COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK != '' }}
      HAS_COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release tooling
        run: node --test packages/twenty-docker/scripts/__tests__/*.test.mjs

      # The frontend build needs ~8 GB heap plus toolchain output; standard
      # runners ship ~14 GB of scratch disk, most of it pre-filled with
      # Android/.NET/Haskell toolchains the image build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo docker image prune -af

      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # Shared runner IPs exhaust Docker Hub's anonymous pull rate limit
          # within minutes; route base image pulls through Google's mirror
          # (upstream CI does the same in ci-test-docker-compose.yaml).
          # config-inline (not config) takes inline TOML content.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve app version
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version package.json)
          if [ "$RELEASE_REF_TYPE" = tag ] && [ "$RELEASE_REF_NAME" != "v$version" ]; then
            echo 'Release tag must match package.json version' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}
            APP_BUILD_ID=${{ github.run_number }}.${{ github.run_attempt }}
            APP_BUILD_DATE=${{ steps.version.outputs.built_at }}
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test candidate with the Coolify stack
        timeout-minutes: 55
        env:
          A2E_SMOKE_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          A2E_SMOKE_REVISION: ${{ github.sha }}
          A2E_SMOKE_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          A2E_SMOKE_REPORT_DIR: ${{ runner.temp }}/a2e-deployment-smoke
        run: |
          docker pull "$A2E_SMOKE_IMAGE"
          node packages/twenty-docker/scripts/smoke-coolify-image.mjs

      - name: Record tested release identity
        env:
          RELEASE_REVISION: ${{ github.sha }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          RELEASE_BUILT_AT: ${{ steps.version.outputs.built_at }}
          RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          A2E_SMOKE_REPORT_DIR: ${{ runner.temp }}/a2e-deployment-smoke
        run: node packages/twenty-docker/scripts/write-release-manifest.mjs

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deployment-smoke-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2e-deployment-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Promote tested image
        id: promote
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          TESTED_REVISION: ${{ github.sha }}
          TESTED_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tags=(--tag "$IMAGE:$TESTED_REVISION" --tag "$IMAGE:build-$RELEASE_BUILD_ID")
          channel_promoted=false
          if [ "$RELEASE_REF" = refs/heads/main ]; then
            main_revision=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$main_revision" = "$TESTED_REVISION" ]; then
              tags+=(--tag "$IMAGE:latest" --tag "$IMAGE:$APP_VERSION")
              channel_promoted=true
            else
              echo 'Historical build published by identity only; latest and deployment left unchanged.' >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            tags+=(--tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:$APP_VERSION")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$TESTED_DIGEST"
          echo "channel_promoted=$channel_promoted" >> "$GITHUB_OUTPUT"

      - name: Keep tested release identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2e-deployment-smoke/release.json
          if-no-files-found: error
          retention-days: 90

      - name: Deploy tested release to Coolify
        id: deploy-api
        if: steps.promote.outputs.channel_promoted == 'true' && env.HAS_COOLIFY_API_TOKEN == 'true'
        timeout-minutes: 35
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          A2E_RELEASE_IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          A2E_RELEASE_REVISION: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          A2E_PUBLIC_URL: ${{ vars.A2E_PUBLIC_URL }}
        run: |
          if [ -z "$A2E_PUBLIC_URL" ]; then
            echo "A2E_PUBLIC_URL is required for production release verification" >&2
            exit 1
          fi
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_main" != "$A2E_RELEASE_REVISION" ]; then
            echo 'Main advanced after promotion; refusing to deploy stale code.' >&2
            exit 1
          fi
          node packages/twenty-docker/scripts/deploy-coolify-release.mjs

      # Retained for existing installations; the authenticated digest path takes precedence.
      - name: Trigger Coolify redeploy
        id: deploy
        if: steps.promote.outputs.channel_promoted == 'true' && env.HAS_COOLIFY_API_TOKEN != 'true' && env.HAS_COOLIFY_DEPLOY_WEBHOOK == 'true'
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: curl --fail --silent --show-error --max-time 60 -X POST "$COOLIFY_DEPLOY_WEBHOOK"

      - name: Verify deployed account entry
        timeout-minutes: 10
        if: (steps.deploy-api.outcome == 'success' || steps.deploy.outcome == 'success') && vars.A2E_PUBLIC_URL != ''
        env:
          A2E_PUBLIC_URL: ${{ vars.A2E_PUBLIC_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if node packages/twenty-docker/scripts/verify-account-entry.mjs --url "$A2E_PUBLIC_URL" --revision "$EXPECTED_REVISION" --build-id "$EXPECTED_BUILD_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 30; fi
          done
          echo "Coolify did not serve the expected frontend/backend and shared account mode in time" >&2
          exit 1

      - name: Report deployment verification configuration
        if: (steps.deploy-api.outcome != 'success' && steps.deploy.outcome != 'success') || vars.A2E_PUBLIC_URL == ''
        run: |
          echo 'Image published; live deployment is unverified. Configure COOLIFY_API_TOKEN, COOLIFY_URL, COOLIFY_APPLICATION_UUID and A2E_PUBLIC_URL to deploy and verify automatically.' >> "$GITHUB_STEP_SUMMARY"
