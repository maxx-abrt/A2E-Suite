name: CD Docker image

# Builds the production image (backend + frontend, Dockerfile target `twenty`)
# and pushes it to GHCR so Coolify / Portainer / any Docker host can pull it
# instead of building on a small VPS (the frontend build needs ~8 GB of heap).

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Package name is fixed so a repo rename does not break pinned image refs in
  # docker-compose.coolify.yml; the owner part stays derived from the repo.
  IMAGE: ghcr.io/${{ github.repository_owner }}/a2e-suite

jobs:
  build-and-push:
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # The frontend build needs ~8 GB heap plus toolchain output; standard
      # runners ship ~14 GB of scratch disk, most of it pre-filled with
      # Android/.NET/Haskell toolchains the image build never touches.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          sudo docker image prune -af

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Shared runner IPs exhaust Docker Hub's anonymous pull rate limit
          # within minutes; route base image pulls through Google's mirror
          # (upstream CI does the same in ci-test-docker-compose.yaml).
          config: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve app version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional zero-touch deploys: set the repo secret COOLIFY_DEPLOY_WEBHOOK
      # to the "Deploy Webhook" URL Coolify shows on the resource, and every
      # green run redeploys the stack right after the image is pushed.
      # (secrets are not readable in `if:` directly, hence the env round-trip)
      - name: Trigger Coolify redeploy
        if: env.COOLIFY_DEPLOY_WEBHOOK != ''
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: curl -fsS -X POST "$COOLIFY_DEPLOY_WEBHOOK"
