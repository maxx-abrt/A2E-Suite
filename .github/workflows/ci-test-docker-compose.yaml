name: CI Docker

permissions:
  contents: read

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changed-files-check:
    if: github.event_name != 'merge_group'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        .dockerignore
        packages/twenty-docker/**
        docker-compose.yml
        docker-compose.coolify.yml
        .github/workflows/ci-test-docker-compose.yaml
        .github/workflows/cd-docker-image.yaml
        packages/twenty-server/src/database/commands/**
        packages/twenty-server/src/main.ts
        packages/twenty-server/src/queue-worker/**
        packages/twenty-server/src/engine/core-modules/health/**
        packages/twenty-server/src/engine/core-modules/message-queue/**
        packages/twenty-server/src/engine/core-modules/client-config/**
        packages/twenty-server/src/engine/core-modules/admin-panel/services/admin-panel-version.service.ts
        packages/twenty-server/src/engine/core-modules/admin-panel/dtos/version-info.dto.ts
        packages/twenty-server/scripts/**
        packages/twenty-server/src/engine/core-modules/application/**
        packages/twenty-server/src/engine/core-modules/logic-function/**
        packages/twenty-server/src/engine/core-modules/twenty-config/**
        packages/twenty-server/src/command/**
        packages/twenty-apps/internal/a2e-*/**
  test-compose:
    needs: changed-files-check
    if: always() && !cancelled() && (github.event_name == 'merge_group' || needs.changed-files-check.outputs.any_changed == 'true')
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pull base images through Google's Docker Hub mirror — avoids Docker Hub
      # rate limits and needs no credentials (this repo is public).
      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
      - name: Build production image
        env:
          A2E_SMOKE_REVISION: ${{ github.sha }}
        run: |
          docker build \
            --target twenty \
            --build-arg "APP_VERSION=$(jq -r .version package.json)" \
            --build-arg "APP_REVISION=$A2E_SMOKE_REVISION" \
            --build-arg "APP_BUILD_ID=${{ github.run_number }}.${{ github.run_attempt }}" \
            --build-arg "APP_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f packages/twenty-docker/twenty/Dockerfile \
            -t "a2e-compose-ci:$A2E_SMOKE_REVISION" \
            .
      - name: Test the Coolify stack
        timeout-minutes: 55
        env:
          A2E_SMOKE_IMAGE: a2e-compose-ci:${{ github.sha }}
          A2E_SMOKE_REVISION: ${{ github.sha }}
          A2E_SMOKE_BUILD_ID: ${{ github.run_number }}.${{ github.run_attempt }}
          A2E_SMOKE_REPORT_DIR: ${{ runner.temp }}/a2e-deployment-smoke
        run: node packages/twenty-docker/scripts/smoke-coolify-image.mjs
      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-smoke-${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2e-deployment-smoke
          if-no-files-found: ignore
          retention-days: 7
  test-app-dev:
    needs: changed-files-check
    if: always() && !cancelled() && (github.event_name == 'merge_group' || needs.changed-files-check.outputs.any_changed == 'true')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pull base images through Google's Docker Hub mirror — avoids Docker Hub
      # rate limits and needs no credentials (this repo is public).
      - name: Configure Docker Hub mirror
        run: |
          echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Create frontend placeholder
        run: |
          mkdir -p packages/twenty-front/build
          echo '<html><body>CI placeholder</body></html>' > packages/twenty-front/build/index.html
      - name: Build app-dev image
        run: |
          docker build \
            --target twenty-app-dev \
            -f packages/twenty-docker/twenty/Dockerfile \
            -t twenty-app-dev-ci \
            .
      - name: Start container
        run: |
          docker run -d --name twenty-app-dev \
            -p 2020:2020 \
            twenty-app-dev-ci
          docker logs twenty-app-dev -f &
      - name: Wait for server health
        run: |
          echo "Waiting for twenty-app-dev to become healthy..."
          count=0
          while true; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2020/healthz 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "Server is healthy!"
              curl -s http://localhost:2020/healthz
              break
            fi

            container_status=$(docker inspect --format='{{.State.Status}}' twenty-app-dev 2>/dev/null || echo "unknown")
            if [ "$container_status" = "exited" ]; then
              echo "Container exited unexpectedly"
              docker logs twenty-app-dev
              exit 1
            fi

            count=$((count+1))
            if [ $count -gt 300 ]; then
              echo "Server did not become healthy within 5 minutes"
              docker logs twenty-app-dev
              exit 1
            fi
            echo "Still waiting... (${count}/300s) [HTTP ${status}]"
            sleep 1
          done
  ci-test-docker-status-check:
    if: always() && !cancelled()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [changed-files-check, test-compose, test-app-dev]
    steps:
      - name: Fail job if any needs failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
