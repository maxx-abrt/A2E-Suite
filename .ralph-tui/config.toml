# Ralph TUI Configuration
# A2E-Suite — executor loop

configVersion = "2.1"
agent = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
tracker = "json"

maxIterations = 20
iterationDelay = 5000
preflightTimeoutMs = 30000
subagentTracingDetail = "minimal"

autoCommit = true
commitMessageTemplate = "agent: {{taskId}} {{taskTitle}}"
prompt_template = ".ralph-tui/prompt.hbs"

[trackerOptions]
path = "./prd.json"

[agentOptions]
# left empty intentionally — no OpenCode-plugin-specific overrides
# documented for agentOptions keys; verify with `ralph-tui config help`
# if you need to pass extra flags to the opencode subprocess

[errorHandling]
strategy = "retry"
maxRetries = 2
retryDelayMs = 10000
continueOnNonZeroExit = false

[rateLimitHandling]
enabled = true
maxRetries = 3
baseBackoffMs = 5000
recoverPrimaryBetweenIterations = true

[parallel]
mode = "never"
