configVersion = "2.1"
maxIterations = 20
iterationDelay = 5000
agent = "opencode"
model = "opencode-go/deepseek-v4.1-flash"
tracker = "json"
prompt_template = ".ralph-tui/prompt.hbs"
autoCommit = true
commitMessageTemplate = "agent: {{taskId}} {{taskTitle}}"
subagentTracingDetail = "minimal"
preflightTimeoutMs = 30000
defaultAgent = "opencode"

[agentOptions]
[trackerOptions]
path = "./prd.json"

[errorHandling]
strategy = "retry"
maxRetries = 2
retryDelayMs = 10000
continueOnNonZeroExit = false

[rateLimitHandling]
enabled = true
maxRetries = 3
baseBackoffMs = 5000
recoverPrimaryBetweenIterations = true

[parallel]
mode = "never"
