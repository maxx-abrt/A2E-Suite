# Self-host stack for the A2E Suite fork, ready for Coolify ("Docker Compose"
# resource pointing at this file) and any plain Docker host.
#
# The image is built by .github/workflows/cd-docker-image.yaml and pushed to
# GHCR, so hosts pull instead of building (the frontend build needs ~8 GB).
#
# Required environment (set in the Coolify UI or a .env file):
#   SERVER_URL             public URL, e.g. https://crm.example.com
#   ENCRYPTION_KEY         generate with: openssl rand -base64 32
#   PG_DATABASE_PASSWORD   strong password, no special characters
#   APP_SECRET             recommended independent secret for a fresh production
#
# Optional environment:
#   A2E_IMAGE              full image reference; prefer a tested @sha256 digest
#   TAG                    fallback image tag (default: latest)
#   SERVER_BIND_ADDRESS    host binding (default: 127.0.0.1; Coolify uses its proxy)
#   SERVER_PORT            host port (default: 3000); 0 is ephemeral, not disabled
#   LANDING_PAGE_URL       optional public marketing landing page
#   FALLBACK_ENCRYPTION_KEY, APP_SECRET, STORAGE_S3_*, EMAIL_* / SMTP vars
#   DISABLE_BUNDLED_APP_PROVISIONING=true  set to skip auto-registration of A2E apps on boot
name: a2e-suite

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  server:
    image: ${A2E_IMAGE:-ghcr.io/maxx-abrt/a2e-suite:${TAG:-latest}}
    pull_policy: always
    init: true
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    expose:
      - '3000'
    ports:
      - '${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-3000}:3000'
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?required}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      A2E_RECOVERY_TARGET_DATABASE: ${A2E_RECOVERY_TARGET_DATABASE:-}
      A2E_RECOVERY_APPLY: ${A2E_RECOVERY_APPLY:-false}
      SERVER_URL: ${SERVER_URL:?required}
      LANDING_PAGE_URL: ${LANDING_PAGE_URL:-}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      IS_SHARED_DOMAIN_WORKSPACE_ENABLED: ${IS_SHARED_DOMAIN_WORKSPACE_ENABLED:-true}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-false}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-false}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}
      STORAGE_S3_PRESIGNED_URL_EXPIRES_IN: ${STORAGE_S3_PRESIGNED_URL_EXPIRES_IN:-900}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Local functions use Docker DNS; Lambda and public links keep SERVER_URL.
      LOGIC_FUNCTION_LOCAL_API_URL: ${LOGIC_FUNCTION_LOCAL_API_URL:-http://server:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      # APP_SECRET falls back to ENCRYPTION_KEY when unset or empty; an empty
      # value reaching the server makes JWT app-secret derivation throw at runtime
      APP_SECRET: ${APP_SECRET:-${ENCRYPTION_KEY}}
      # bundled A2E app provisioning runs here, never on the worker; `true` opts out
      DISABLE_BUNDLED_APP_PROVISIONING: ${DISABLE_BUNDLED_APP_PROVISIONING:-false}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-${RESEND_API_KEY:-}}
      EMAIL_SMTP_NO_TLS: ${EMAIL_SMTP_NO_TLS:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@yourdomain.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-A2E Suite}
      IS_EMAIL_VERIFICATION_REQUIRED: ${IS_EMAIL_VERIFICATION_REQUIRED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # MESSAGING_PROVIDER_GMAIL_ENABLED: ${MESSAGING_PROVIDER_GMAIL_ENABLED}
      # CALENDAR_PROVIDER_GOOGLE_ENABLED: ${CALENDAR_PROVIDER_GOOGLE_ENABLED}
      # AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID}
      # AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET}
      # AUTH_GOOGLE_CALLBACK_URL: ${AUTH_GOOGLE_CALLBACK_URL}
      # AUTH_GOOGLE_APIS_CALLBACK_URL: ${AUTH_GOOGLE_APIS_CALLBACK_URL}

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz checks database and redis; /healthz stays a liveness-only probe.
      # start_period must cover the first-boot migration + bundled-app
      # provisioning window; a slow VPS can exceed the default 5 min, and a
      # premature "unhealthy" fails the worker's service_healthy dependency
      # before the API ever comes up.
      test: ['CMD', 'curl', '--fail', '--silent', '--show-error', '--max-time', '8', 'http://localhost:3000/readyz']
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 900s
    restart: always

  worker:
    image: ${A2E_IMAGE:-ghcr.io/maxx-abrt/a2e-suite:${TAG:-latest}}
    pull_policy: always
    init: true
    stop_grace_period: 120s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    command: ['node', 'dist/queue-worker/queue-worker']
    environment:
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-postgres}:${PG_DATABASE_PASSWORD:?required}@${PG_DATABASE_HOST:-db}:${PG_DATABASE_PORT:-5432}/${PG_DATABASE_NAME:-default}
      SERVER_URL: ${SERVER_URL:?required}
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-false}
      IS_SHARED_DOMAIN_WORKSPACE_ENABLED: ${IS_SHARED_DOMAIN_WORKSPACE_ENABLED:-true}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-false}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DISABLE_DB_MIGRATIONS: 'true' # it already runs on the server
      DISABLE_CRON_JOBS_REGISTRATION: 'true' # it already runs on the server
      DISABLE_BUNDLED_APP_PROVISIONING: 'true' # it already runs on the server
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_S3_PRESIGNED_URL_ENABLED: ${STORAGE_S3_PRESIGNED_URL_ENABLED:-false}
      STORAGE_S3_PRESIGNED_URL_BASE: ${STORAGE_S3_PRESIGNED_URL_BASE:-}
      STORAGE_S3_PRESIGNED_URL_EXPIRES_IN: ${STORAGE_S3_PRESIGNED_URL_EXPIRES_IN:-900}
      LOGIC_FUNCTION_TYPE: ${LOGIC_FUNCTION_TYPE:-LOCAL}
      # Local functions use Docker DNS; Lambda and public links keep SERVER_URL.
      LOGIC_FUNCTION_LOCAL_API_URL: ${LOGIC_FUNCTION_LOCAL_API_URL:-http://server:3000}
      WORKER_HEALTH_PORT: 3099
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      FALLBACK_ENCRYPTION_KEY: ${FALLBACK_ENCRYPTION_KEY:-}
      # APP_SECRET falls back to ENCRYPTION_KEY when unset or empty; an empty
      # value reaching the server makes JWT app-secret derivation throw at runtime
      APP_SECRET: ${APP_SECRET:-${ENCRYPTION_KEY}}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_NAME: ${STORAGE_S3_NAME:-}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
      STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-LOGGER}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-${RESEND_API_KEY:-}}
      EMAIL_SMTP_NO_TLS: ${EMAIL_SMTP_NO_TLS:-false}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@yourdomain.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-A2E Suite}
      IS_EMAIL_VERIFICATION_REQUIRED: ${IS_EMAIL_VERIFICATION_REQUIRED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      # /healthz is liveness-only; /readyz exercises the worker's own database
      # and redis connections (node:http server on WORKER_HEALTH_PORT, 3099)
      test: ['CMD', 'curl', '--fail', '--silent', '--show-error', '--max-time', '8', 'http://localhost:3099/readyz']
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: always

  db:
    image: postgres:16
    stop_grace_period: 60s
    logging: *default-logging
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?required}
      POSTGRES_USER: ${PG_DATABASE_USER:-postgres}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    healthcheck:
      test: pg_isready -U ${PG_DATABASE_USER:-postgres} -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  redis:
    image: redis:7
    stop_grace_period: 60s
    logging: *default-logging
    restart: always
    volumes:
      - redis-data:/data
    command: ['--maxmemory-policy', 'noeviction', '--appendonly', 'yes', '--appendfsync', 'everysec']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  server-local-data:
  redis-data:
